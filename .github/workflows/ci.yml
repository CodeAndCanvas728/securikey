name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: PYTHONPATH=plugin python3 -m unittest discover -s tests -t . -v
      - name: Manifests are valid JSON
        run: |
          python3 -m json.tool plugin/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugin/hooks/hooks.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: No secrets committed
        run: python3 ci/scan_secrets.py

  validate:
    # `claude plugin validate` needs node and no login. Pinned: a new release may add checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Plugin and marketplace validate
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.309
          claude plugin validate plugin --profile directory --strict
          claude plugin validate . --strict
